name: Sync Plugins Metadata

on:
  workflow_dispatch:

jobs:
  sync-metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 1. Checkout 'main' branch (target)
        uses: actions/checkout@v7
        with:
          ref: main

      - name: 2. Checkout 'source' branch (source files)
        uses: actions/checkout@v7
        with:
          ref: source
          path: .source

      - name: 3. Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: 4. Install dependencies
        run: pip install -r .source/scripts/requirements.txt

      - name: 5. Run the sync script
        run: python .source/scripts/sync_plugins.py
        env:
          OUTPUT_DIR: ./plugins

      - name: 6. Commit and Push to main
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: main
          file_pattern: plugins/
          commit_message: "ci: Sync plugin metadata from source branch"
          commit_user_name: "GitHub Actions Bot"
          commit_user_email: "actions@github.com"